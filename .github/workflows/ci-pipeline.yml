name: Flo AI - CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-build-test:
    name: React Frontend Kontrolü
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flo-frontend
    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v4
    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Bağımlılıkları Yükle
      run: npm install
    - name: Arayüzü Derle (Build Testi)
      run: npm run build

  backend-check:
    name: FastAPI Backend Kontrolü
    runs-on: ubuntu-latest
    steps:
    - name: Kodu Çek
      uses: actions/checkout@v4
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt